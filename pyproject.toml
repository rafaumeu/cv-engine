[project]
name = "cv-engine"
version = "0.1.0"
description = "ATS-optimized CV engine for career-ops"
requires-python = ">=3.11"
dependencies = [
    "pydantic[email]>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
